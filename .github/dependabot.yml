version: 2

updates:
  # The runner actions first. A stale action is the update nobody notices,
  # because nothing it does appears in the package.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore

  # Everything in package.json is a devDependency: the package ships no runtime
  # dependency at all, and `pdfjs-dist` is an optional peer the caller owns. So
  # one grouped pull request a month, not fourteen: none of them can reach
  # anybody who installed truecopy.
  #
  # Minors and patches only, in that group. A major goes out on its own, because
  # grouping them makes one pull request that no amount of review can rescue:
  # the whole batch fails when a single member's new major disagrees with a peer
  # range, and there is no way to take the other two.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      toolchain:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore

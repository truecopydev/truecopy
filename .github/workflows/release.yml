# Tag a release and publish its GitHub Release, from the changelog.
#
# Step 3 of RELEASING.md, so that it is a button rather than a sequence of
# commands typed correctly. The runner holds the write token, so the tag is
# created here rather than pushed from a laptop - and the notes are the
# changelog section itself, which means the release page and the changelog
# cannot drift apart.
#
# `refs/tags/v*` accepts no update at all - not a deletion, not a rewind, and not
# a move forward - so a tag created here is final. Naming the third one matters:
# forbidding force-push only blocks a rewind, and walking a release tag forward
# onto a later commit is a fast-forward that goes straight through. That is
# deliberate: npm provenance attests a commit, and an attestation pointing at a
# movable tag attests nothing.
#
# Idempotent: a version already released keeps its tag untouched and only has
# its notes refreshed. Publishing to npm is a separate, deliberate act - see
# publish.yml.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 1.0.1). A leading v is accepted.
        required: true
      sha:
        description: Commit to tag. Defaults to the dispatched ref.
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # The release is cut with gh and its own token; git never pushes here.
          persist-credentials: false

      - name: resolve the commit and the version
        id: target
        run: |
          sha="${{ inputs.sha }}"
          [ -z "$sha" ] && sha="${{ github.sha }}"
          # A full sha: the release API rejects an abbreviated one.
          sha=$(git rev-parse "${sha}^{commit}")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # Typing the tag rather than the version is a reflex. The changelog
          # heading reads "## [1.0.1]", so a dispatch on "v1.0.1" would look for
          # a section that cannot exist. The prefix is absorbed here, once.
          version="${{ inputs.version }}"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      # The tree and the changelog have to agree before a tag exists, not after.
      - name: the version is declared and described
        run: |
          version="${{ steps.target.outputs.version }}"
          declared=$(node -p "require('./package.json').version")
          if [ "$version" != "$declared" ]; then
            echo "::error::asked for $version, package.json says $declared - the release PR has not landed on this commit."
            exit 1
          fi
          awk -v v="$version" '
            $0 ~ ("^## \\[" v "\\]") { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::no changelog section for [$version]."
            exit 1
          fi

      - name: create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.target.outputs.version }}"
          sha="${{ steps.target.outputs.sha }}"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version is already released; refreshing its notes from the changelog."
            gh release edit "v$version" --repo "$GITHUB_REPOSITORY" --notes-file RELEASE_NOTES.md
            exit 0
          fi
          gh release create "v$version" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$sha" \
            --title "v$version" \
            --notes-file RELEASE_NOTES.md
